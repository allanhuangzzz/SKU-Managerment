# GitHub Actions: 推送代码到 master 后，自动构建 Docker 映像并推送到 GHCR
# 生效后：本地 git push -> GitHub 自动出包 -> NAS 拉新映像即更新

name: build-docker-image

on:
  push:
    branches: [master, main]
  workflow_dispatch:        # 允许在 GitHub Actions 页面手动触发

env:
  IMAGE_NAME: sku-managerment

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 允许推送到 GHCR

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 自动提供的令牌，无需自己配置

      - name: 构建并推送映像
        uses: docker/build-push-action@v6
        with:
          context: ./deploy_nas           # 构建上下文 = deploy_nas（含 Dockerfile）
          file: ./deploy_nas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
