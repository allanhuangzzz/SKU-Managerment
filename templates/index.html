<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品SKU管理系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">SKU 管理系统</div>
    <nav class="nav">
      <a class="nav-item active" data-view="products">产品信息</a>
      <a class="nav-item" data-view="shipping">运费维护</a>
      <a class="nav-item" data-view="commissions">佣金维护</a>
      <a class="nav-item" data-view="rates">汇率维护</a>
    </nav>
    <div class="sidebar-foot">v1.0</div>
  </aside>

  <main class="main">
    <header class="page-header">
      <h1 class="page-title" id="page-title">产品信息</h1>
      <div class="toolbar" id="toolbar"></div>
    </header>

    <section class="view active" id="view-products">
      <div class="filter-bar" id="product-filter">
        <div class="filter-left">
          <input type="search" id="product-search" class="input" placeholder="搜索 SKU / 产品名称" style="width:280px">
        </div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="table" id="product-table">
            <thead>
              <tr>
                <th style="width:56px">图片</th>
                <th>产品名称</th>
                <th>SKU</th>
                <th>货物类型</th>
                <th>尺寸（cm）</th>
                <th class="num">进货价（¥）</th>
                <th class="num">国内运费（¥）</th>
                <th class="num">重量（kg）</th>
                <th class="op">操作</th>
              </tr>
            </thead>
            <tbody id="product-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="view" id="view-shipping">
      <div class="filter-bar">
        <div class="filter-left">
          <select id="shipping-country-filter" class="input" style="width:190px"></select>
          <select id="shipping-channel-filter" class="input" style="width:180px"></select>
          <input type="search" id="shipping-search" class="input" placeholder="搜索货物类型 / 备注" style="width:220px">
        </div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="table" id="shipping-table">
            <thead>
              <tr>
                <th style="width:38px"></th>
                <th>国家</th>
                <th class="num">规则数</th>
                <th class="op">操作</th>
              </tr>
            </thead>
            <tbody id="shipping-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="view" id="view-commissions">
      <div class="card">
        <div class="table-wrap">
          <table class="table" id="commission-table">
            <thead>
              <tr>
                <th>国家</th>
                <th>国家代码</th>
                <th class="num">佣金率（%）</th>
                <th class="op">操作</th>
              </tr>
            </thead>
            <tbody id="commission-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="view" id="view-rates">
      <div class="card" style="margin-bottom:14px">
        <div class="rates-tip" id="rates-tip">汇率数据未刷新，点击右上角「刷新实时汇率」从公开接口获取最新汇率。</div>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table class="table" id="rates-table">
            <thead>
              <tr>
                <th>国家</th>
                <th>国家代码</th>
                <th>币种</th>
                <th class="num">汇率（1外币 = ¥）</th>
                <th>来源</th>
                <th>更新时间</th>
                <th class="op">操作</th>
              </tr>
            </thead>
            <tbody id="rates-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal" id="modal-box"></div>
  </div>

  <div class="toast-root" id="toast-root"></div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/products.js"></script>
  <script src="/static/js/shipping.js"></script>
  <script src="/static/js/commissions.js"></script>
  <script src="/static/js/rates.js"></script>
</body>
</html>
