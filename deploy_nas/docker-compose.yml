# 产品SKU管理系统 - Docker Compose（镜像流模式 + 面板一键更新）
# 代码由 GitHub Actions 自动构建并推送到 GHCR 与 Docker Hub；
# 本文件负责：拉取最新镜像 + 挂载 NAS 本地数据 + 由 watchtower 执行面板"一键更新"。
#
# 用法：Container Manager 新增项目，路径选本目录（含 data/ 子目录与数据）
# 数据持久化：宿主机 ./data 目录（sku.db 数据库 + uploads 产品图），重建容器不丢数据
# 更新方式：1) 面板左下角「一键更新」按钮（调用 watchtower 拉取并重建本容器）
#           2) 群晖映像页点"更新"  3) SSH：docker compose pull && docker compose up -d

services:
  sku:
    image: docker.io/allanhuangzzz/sku-managerment:latest
    container_name: sku-manager
    restart: always            # NAS 重启 / 容器异常退出后自动拉起
    ports:
      # 仅绑定本机回环：公网/局域网都打不到 5050，只能经群晖反向代理（HTTPS）进入。
      # 全程 HTTPS 的对外访问方式见「部署说明.md → 外网访问（域名 + 端口）」。
      - "127.0.0.1:5050:5050"
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
      # 登录鉴权：AUTH_PASSWORD 留空 = 不启用登录（仅建议内网测试时）；对外访问务必设置强密码
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
      AUTH_SECRET: "${AUTH_SECRET:-}"          # 会话签名密钥（随机长字符串）；留空则每次重启都需重新登录
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-1}"   # 1=仅 HTTPS 发送会话 cookie；用 http 直连调试时改 0
      # 面板「一键更新」按钮：请求 watchtower 的 HTTP API
      UPDATE_TRIGGER_URL: "http://watchtower:8080/v1/update"
      UPDATE_TRIGGER_TOKEN: "${UPDATE_TOKEN:-sku-nas-update}"
    volumes:
      - ./data/sku.db:/app/sku.db              # 数据库持久化（文件级挂载）
      - ./data/uploads:/app/static/uploads     # 产品图片持久化（目录级挂载）
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # 允许被 watchtower 更新

  # 更新执行器：不轮询、不主动做事，仅在被面板按钮调用时拉取新镜像并重建 sku 容器
  watchtower:
    image: docker.io/containrrr/watchtower:latest
    container_name: sku-watchtower
    restart: always
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"      # 开启 HTTP API 触发模式（默认不启用定时轮询）
      WATCHTOWER_HTTP_API_TOKEN: "${UPDATE_TOKEN:-sku-nas-update}"
      WATCHTOWER_LABEL_ENABLE: "true"         # 只更新带 enable=true 标签的容器
      WATCHTOWER_CLEANUP: "true"              # 更新后删除旧镜像，释放空间
      TZ: "Asia/Shanghai"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 执行更新所必需
