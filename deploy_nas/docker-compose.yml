# 产品SKU管理系统 - Docker Compose（镜像流模式）
# 代码由 GitHub Actions 自动构建并推送到 GHCR 与 Docker Hub；
# 本文件只负责：拉取最新镜像 + 挂载 NAS 本地数据，不再本地构建。
#
# 用法：Container Manager 新增项目，路径选本目录（含 data/ 子目录与 data 数据）
# 数据持久化：宿主机 ./data 目录（sku.db 数据库 + uploads 产品图），重建容器不丢数据
# 更新方式：GitHub 代码有更新后，Container Manager 映像标签会出现"可用更新"，
#           点更新（或 docker compose pull && up -d）即拉取新镜像重启

services:
  sku:
    image: docker.io/allanhuangzzz/sku-managerment:latest
    container_name: sku-manager
    restart: always            # NAS 重启 / 容器异常退出后自动拉起
    ports:
      - "5050:5050"            # 宿主机端口:容器端口；想换访问端口改左边即可
    environment:
      HOST: "0.0.0.0"
      PORT: "5050"
    volumes:
      - ./data/sku.db:/app/sku.db              # 数据库持久化（文件级挂载）
      - ./data/uploads:/app/static/uploads     # 产品图片持久化（目录级挂载）
